<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Eco-Retos | Registro</title>

    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="../../mainContainer.css">
    <link rel="stylesheet" href="./signup.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="app-wrapper">

    <div class="phone-frame">

        <div class="phone-screen">

            <div class="signup-header">

                <a href="../login/login.html" class="back-auth">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>

                <h1>Crea tu cuenta</h1>
                <p>Únete a la comunidad Eco-Retos</p>

            </div>

            <div class="signup-content">

                <form id="signupForm">

                    <div class="form-group">
                        <i class="fa-solid fa-user"></i>

                        <input
                            type="text"
                            id="name"
                            class="input-control"
                            placeholder="Nombre completo"
                            required>
                    </div>

                    <div class="form-group">
                        <i class="fa-solid fa-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            class="input-control"
                            placeholder="Correo electrónico"
                            required>
                    </div>

                    <div class="form-group">
                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="password"
                            class="input-control"
                            placeholder="Contraseña"
                            required>
                    </div>

                    <div class="form-group">
                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="confirmPassword"
                            class="input-control"
                            placeholder="Confirmar contraseña"
                            required>
                    </div>

                    <label class="terms-box">
                        <input type="checkbox" id="terms">
                        <span>Acepto los términos y la política de privacidad</span>
                    </label>

                    <button
                        type="submit"
                        class="btn-primary">
                        Crear cuenta
                    </button>

                </form>

                <div class="login-link">
                    ¿Ya tienes cuenta?
                    <a href="../login/login.html">Inicia sesión</a>
                </div>

            </div>

        </div>

    </div>

</div>

<script src="../../auth.js"></script>
<script src="./signup.js"></script>

</body>
</html>
